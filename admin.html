<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Panel de Clima Garnier</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="marca.css">
<style>
body{background:#F3F5EE}
/* inicio de sesión */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.login-marca{background:var(--petroleo);color:var(--blanco);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:48px 56px}
.login-marca img{height:52px;width:auto;align-self:flex-start}
.login-marca h2{color:var(--blanco);font-size:clamp(30px,3.2vw,46px);line-height:1.12;max-width:14ch}
.login-marca p{color:#CFE0DF;max-width:44ch;font-size:16px}
.login-marca .l1,.login-marca .l2{position:absolute;height:1.5px;background:var(--verde);transform:rotate(-27deg);transform-origin:left}
.login-marca .l1{width:42%;right:-8%;bottom:14%}.login-marca .l2{width:30%;right:-12%;top:5%}
.login-marca .barra{position:absolute;right:0;bottom:0;width:40%;height:8px;background:var(--verde)}
.login-form{display:grid;place-items:center;padding:24px 16px}
@media (max-width:860px){.login{grid-template-columns:1fr}.login-marca{padding:28px 24px;gap:18px}.login-marca h2{font-size:28px}.login-marca .l1,.login-marca .l2{display:none}}
.login form{width:100%;max-width:390px;background:var(--blanco);border-radius:18px;padding:32px 26px;display:flex;flex-direction:column;gap:16px;border-top:6px solid var(--verde);box-shadow:0 10px 30px rgba(0,60,64,.08)}
.login form h1{font-size:28px}
label.campo{display:flex;flex-direction:column;gap:6px;font-size:14px;min-width:0}
.campo input,.campo select,.campo textarea,input.txt,select.txt,textarea.txt{border:1.5px solid var(--gris-linea);border-radius:10px;padding:11px 12px;background:var(--blanco);color:var(--petroleo);width:100%}
.campo input:focus,input.txt:focus,select.txt:focus,textarea.txt:focus{outline:none;border-color:var(--verde);box-shadow:0 0 0 3px var(--verde-suave)}
textarea.txt{resize:vertical;min-height:70px}
.error{color:var(--rojo);font-size:14px;min-height:1em}
/* botón gris "Editar aquí" */
.editar{appearance:none;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;line-height:1;color:#7C7E78;background:#F1F2EE;border:1px dashed #BFC2BA;border-radius:999px;padding:5px 11px;cursor:pointer;white-space:nowrap;transition:all .2s;flex:none}
.editar:hover,.editar:focus-visible{color:var(--petroleo);border-color:var(--verde);border-style:solid;background:var(--verde-suave)}
.editar svg{flex:none}
.etq{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--gris)}
.etq b{font-weight:500;color:var(--petroleo)}
.nota{font-size:13px;color:#7C7E78;margin:0}
/* ===================== estructura tipo dashboard ===================== */
body{background:#F4F6F1}
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(105deg,#002B2E 0%,#003C40 48%,#0C5A4A 100%);color:#fff;padding-top:env(safe-area-inset-top,0px);overflow:visible}
.topbar::after{content:"";position:absolute;inset:0 0 0 auto;width:34%;background:url(hojas.jpg) 70% 38%/cover no-repeat;-webkit-mask-image:linear-gradient(to left,#000 10%,transparent 95%);mask-image:linear-gradient(to left,#000 10%,transparent 95%);opacity:.55;pointer-events:none}
.top-in{position:relative;z-index:1;display:flex;align-items:center;gap:22px;min-height:76px;padding:10px 28px;max-width:1720px;margin:0 auto}
.top-marca{display:flex;align-items:center;gap:18px;flex:none}
.top-marca img{height:40px;width:auto;display:block}
.top-marca .div{width:1px;height:36px;background:rgba(255,255,255,.25)}
.top-marca .app{display:flex;flex-direction:column;line-height:1.25}
.top-marca small{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#BFD7D5}
.top-marca b{font-weight:500;font-size:15px;color:#fff}
.top-nav{display:flex;align-items:center;gap:4px;flex-wrap:nowrap;overflow-x:auto;min-width:0}
.top-nav>a,.top-nav>button{appearance:none;border:0;background:transparent;color:#E4EFEE;display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border-radius:999px;cursor:pointer;font-size:14.5px;font-weight:500;white-space:nowrap;text-decoration:none;transition:background .2s,color .2s}
.top-nav>a:hover,.top-nav>button:hover{background:rgba(255,255,255,.1);color:#fff}
.top-nav>.on{background:var(--verde);color:var(--petroleo)}
.top-nav svg{width:18px;height:18px}
.top-estado{display:inline-flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px;gap:2px;flex:none}
.top-estado button{border:0;background:transparent;color:#D5E5E4;font-size:13px;padding:7px 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:500}
.top-estado button.on{background:#fff;color:var(--petroleo)}
.top-estado button.on[data-e="abierta"]{background:var(--verde)}
.top-estado svg{width:15px;height:15px}
.top-der{margin-left:auto;display:flex;align-items:center;gap:14px;flex:none}
.buscar{position:relative}
.buscar input{width:200px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:999px;color:#fff;padding:10px 14px 10px 40px;font-size:14px}
.buscar input::placeholder{color:#BFD7D5}
.buscar input:focus{outline:none;background:rgba(255,255,255,.18);border-color:var(--verde)}
.buscar>svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:#BFD7D5;pointer-events:none}
.desplegable{position:absolute;right:0;top:calc(100% + 10px);background:#fff;color:var(--gris);border-radius:14px;box-shadow:0 18px 40px rgba(0,40,43,.22);min-width:320px;max-width:420px;max-height:420px;overflow:auto;padding:8px;z-index:40}
.desplegable[hidden]{display:none}
.desplegable button{appearance:none;width:100%;border:0;background:none;text-align:left;padding:10px 12px;border-radius:10px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--petroleo)}
.desplegable button:hover{background:var(--verde-suave)}
.desplegable small{display:block;color:#7C7E78;font-size:12px}
.desplegable .vacio-d{padding:12px;font-size:13.5px;color:#7C7E78}
.campana{position:relative;appearance:none;border:0;background:transparent;color:#fff;cursor:pointer;width:42px;height:42px;border-radius:50%;display:grid;place-items:center}
.campana:hover{background:rgba(255,255,255,.1)}
.campana svg{width:22px;height:22px}
.campana .num{position:absolute;top:2px;right:0;min-width:19px;height:19px;border-radius:999px;background:var(--verde);color:var(--petroleo);font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 5px}
.usuario-btn{appearance:none;border:0;background:transparent;color:#fff;display:flex;align-items:center;gap:10px;cursor:pointer;padding:4px 6px 4px 4px;border-radius:999px;font-size:14.5px;font-weight:500}
.usuario-btn:hover{background:rgba(255,255,255,.1)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--verde-suave);color:var(--petroleo);display:grid;place-items:center;font-weight:600;font-size:15px;flex:none;overflow:hidden;border:2px solid rgba(255,255,255,.7)}
.avatar img{width:100%;height:100%;object-fit:cover}
.usuario-btn svg{width:16px;height:16px}
/* subbarra */
.subbar{background:#fff;border-bottom:1px solid var(--gris-claro);position:sticky;top:calc(76px + env(safe-area-inset-top,0px));z-index:15}
.sub-in{display:flex;align-items:center;gap:18px;padding:10px 28px;max-width:1720px;margin:0 auto;flex-wrap:wrap}
.sel-enc{display:flex;align-items:center;gap:10px;min-width:0}
.sel-enc .ic{width:34px;height:34px;border-radius:10px;background:var(--verde-suave);color:#5E7A14;display:grid;place-items:center;flex:none}
.sel-enc .ic svg{width:18px;height:18px}
.sel-enc label{font-size:12px;color:#7C7E78;letter-spacing:.06em;text-transform:uppercase;flex:none}
.sel-enc select{border:1.5px solid var(--gris-claro);border-radius:999px;background:#fff;font-weight:500;color:var(--petroleo);font-size:14.5px;padding:9px 14px;max-width:340px;min-width:0;cursor:pointer;box-shadow:0 2px 8px rgba(0,60,64,.05)}
.tabs{display:flex;gap:4px;margin-inline:auto}
.tabs button{border:0;background:none;padding:10px 18px;cursor:pointer;color:var(--gris);border-bottom:3px solid transparent;font-weight:500;white-space:nowrap;font-size:15px}
.tabs button:hover{color:var(--petroleo)}
.tabs button.on{color:var(--petroleo);border-bottom-color:var(--verde)}
.badge{display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 6px;border-radius:999px;background:var(--verde-suave);color:#5E7A14;font-size:12px;font-weight:600;margin-left:6px;font-variant-numeric:tabular-nums}
.guardado{font-size:12.5px;color:var(--gris);display:flex;align-items:center;gap:8px;background:#F4F6F1;border-radius:999px;padding:7px 14px;white-space:nowrap}
.guardado::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--verde)}
.sub-acc{display:flex;gap:10px;align-items:center}
a.btn,a.cta{text-decoration:none}
.btn svg,.cta svg{width:17px;height:17px}
.cta.sm{padding:10px 18px;font-size:14.5px;border-radius:12px}
/* tres columnas */
.marco3{display:grid;grid-template-columns:250px minmax(0,1fr) 340px;gap:26px;max-width:1720px;margin:0 auto;padding:22px 28px 90px;align-items:start}
.lateral{position:sticky;top:160px;display:flex;flex-direction:column;gap:14px}
.menu{background:#fff;border:1px solid var(--gris-claro);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:4px}
.menu button{appearance:none;border:0;background:none;display:flex;align-items:center;gap:14px;padding:13px 14px;border-radius:12px;cursor:pointer;font-size:15px;color:var(--petroleo);font-weight:500;text-align:left}
.menu button:hover{background:#F4F6F1}
.menu button.on{background:var(--verde-suave)}
.menu button svg{width:21px;height:21px;flex:none}
.menu button .fin{margin-left:auto;color:#9A9C96}
.menu button .badge{margin-left:auto}
.hoja-card{position:relative;overflow:hidden;background:#fff;border:1px solid var(--gris-claro);border-radius:18px;padding:18px 18px 70px;min-height:150px}
.hoja-card svg{width:22px;height:22px;color:#5E7A14}
.hoja-card p{position:relative;z-index:1;margin:10px 0 0;font-size:14px;color:var(--petroleo);max-width:16ch}
.hoja-card::after{content:"";position:absolute;right:-30px;bottom:-30px;width:190px;height:130px;background:url(hojas.jpg) 62% 30%/260% no-repeat;border-radius:60% 0 0 0;transform:rotate(-12deg);opacity:.95}
main#cuerpo{min-width:0}
.riel{position:sticky;top:160px;display:flex;flex-direction:column;gap:16px}
.cita{position:relative;overflow:hidden;border-radius:18px;background:#fff;border:1px solid var(--gris-claro);padding:24px 22px 26px;min-height:170px}
.cita::before{content:"";position:absolute;inset:0;background:url(hojas.jpg) 75% 45%/cover no-repeat;opacity:.18}
.cita::after{content:"";position:absolute;right:-34px;bottom:-40px;width:120px;height:120px;background:url(hojas.jpg) 58% 22%/230% no-repeat;border-radius:50%;opacity:.9}
.cita>*{position:relative;z-index:1}
.cita .ico-c{width:42px;height:42px;border-radius:12px;background:var(--verde-suave);color:#5E7A14;display:grid;place-items:center;margin-bottom:12px}
.cita .ico-c svg{width:22px;height:22px}
.cita blockquote{margin:0;font-style:italic;color:var(--petroleo);font-size:15.5px;line-height:1.55;max-width:21ch;padding-right:40px}
.cita hr{width:28px;border:0;border-top:2px solid var(--verde);margin:14px 0 0}
.panel-c{background:#fff;border:1px solid var(--gris-claro);border-radius:18px;padding:20px}
.panel-c h3{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:500;margin-bottom:14px}
.panel-c h3 svg{width:22px;height:22px;color:var(--petroleo)}
.act{display:flex;flex-direction:column}
.act-it{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #F0F1EC;font-size:13.5px}
.act-it:last-child{border-bottom:0}
.act-ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}
.act-ic svg{width:16px;height:16px}
.act-ic.guardar{background:#7FAE2E}.act-ic.editar{background:#2F7DD1}.act-ic.crear{background:#8B5CF6}.act-ic.eliminar{background:var(--rojo)}.act-ic.acceso{background:#16865C}.act-ic.estado{background:var(--ambar)}
.act-it .tx{flex:1;min-width:0;color:var(--petroleo);overflow-wrap:anywhere}
.act-it .tx small{display:block;color:#8A8C86;font-size:12px;margin-top:2px}
.act-it time{font-size:12px;color:#8A8C86;white-space:nowrap}
.opinion{text-decoration:none;appearance:none;width:100%;text-align:left;cursor:pointer;display:flex;align-items:center;gap:16px;background:linear-gradient(90deg,#EEF6D2,#F7FAEE);border:1px solid var(--verde-medio);border-radius:18px;padding:16px 18px;color:var(--petroleo)}
.opinion .ph{width:64px;height:64px;border-radius:14px;background:url(hojas.jpg) 55% 35%/280% no-repeat;flex:none}
.opinion b{font-weight:600;font-size:15.5px;line-height:1.3;flex:1}
.opinion .ir{width:32px;height:32px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.opinion .ir svg{width:17px;height:17px}
/* inicio */
.hero{position:relative;overflow:hidden;border-radius:20px;background:linear-gradient(100deg,#003C40 0%,#0B4F47 55%,#155F40 100%);color:#fff;padding:26px 30px;min-height:136px;display:flex;align-items:center}
.hero::after{content:"";position:absolute;inset:0 0 0 auto;width:52%;background:url(hojas.jpg) 70% 40%/cover no-repeat;-webkit-mask-image:linear-gradient(to left,#000 25%,transparent 100%);mask-image:linear-gradient(to left,#000 25%,transparent 100%);opacity:.75}
.hero>div{position:relative;z-index:1;max-width:60%}
.hero h1{color:#fff;font-size:28px;font-weight:500;display:flex;align-items:center;gap:10px}
.hero h1 svg{width:26px;height:26px;color:var(--verde)}
.hero p{margin:8px 0 0;color:#D5E5E4;font-size:15.5px}
.pill-estado{position:absolute;right:22px;top:22px;z-index:2;display:inline-flex;align-items:center;gap:8px;background:rgba(0,30,32,.55);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(4px);color:#fff;border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:500}
.pill-estado::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--verde)}
.pill-estado.borrador::before{background:#C9CBC4}.pill-estado.cerrada::before{background:var(--ambar)}
.kpis4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:18px}
.kpi4{background:#fff;border:1px solid var(--gris-claro);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:box-shadow .2s,transform .2s;text-align:left;appearance:none;font:inherit;color:inherit}
.kpi4:hover{box-shadow:0 10px 24px rgba(0,60,64,.08);transform:translateY(-2px)}
.kpi4 .cab-k{display:flex;align-items:center;gap:12px}
.kpi4 .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.kpi4 .ic svg{width:22px;height:22px}
.kpi4 .ic.a{background:#E3F1EF;color:#0F766E}.kpi4 .ic.b{background:var(--verde-suave);color:#5E7A14}.kpi4 .ic.c{background:#E4F0E6;color:#166534}.kpi4 .ic.d{background:#E8EEF7;color:#1E4E8C}
.kpi4 .t{font-size:14px;color:var(--gris);flex:1}
.kpi4 .flecha{color:#B0B3AC;width:16px;height:16px}
.kpi4 strong{font-size:30px;font-weight:500;color:var(--petroleo);font-variant-numeric:tabular-nums;line-height:1}
.kpi4 strong small{font-size:17px;color:#8A8C86;font-weight:400}
.prog{height:8px;border-radius:999px;background:var(--gris-claro);overflow:hidden}
.prog i{display:block;height:100%;background:var(--verde);border-radius:999px}
.dos{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:16px}
.tarjeta-d{background:#fff;border:1px solid var(--gris-claro);border-radius:18px;padding:22px}
.tarjeta-d h3{font-size:18px;font-weight:500;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.leyenda{display:flex;gap:14px;font-size:12.5px;color:var(--gris);font-weight:400}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:9px;height:9px;border-radius:50%;display:inline-block}
.dona-caja{display:flex;align-items:center;gap:30px;flex-wrap:wrap}
.dona{position:relative;width:190px;height:190px;flex:none}
.dona svg{width:100%;height:100%;transform:rotate(-90deg)}
.dona .centro{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.dona .centro strong{display:block;font-size:30px;font-weight:500;color:var(--petroleo);font-variant-numeric:tabular-nums}
.dona .centro span{font-size:13px;color:var(--gris)}
.dona-datos{display:flex;flex-direction:column;gap:18px}
.dona-datos strong{display:block;font-size:26px;font-weight:500;color:var(--petroleo);font-variant-numeric:tabular-nums}
.dona-datos span{font-size:13.5px;color:var(--gris)}
.barras{display:flex;flex-direction:column;gap:13px}
.barra-s{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) 62px;gap:12px;align-items:center;font-size:14px}
.barra-s .n{color:var(--petroleo);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barra-s .t{height:9px;border-radius:999px;background:var(--gris-claro);overflow:hidden}
.barra-s .t i{display:block;height:100%;border-radius:999px}
.barra-s .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--gris);font-size:13px}
.nivel-a{background:#7FAE2E}.nivel-m{background:var(--ambar)}.nivel-b{background:var(--rojo)}.nivel-0{background:#C9CBC4}
.top-sel{display:flex;flex-direction:column}
.top-sel .fila-s{display:grid;grid-template-columns:30px minmax(0,1fr) 120px 52px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #F0F1EC;font-size:14px}
.top-sel .pos{width:28px;height:28px;border-radius:50%;background:var(--verde-suave);color:#5E7A14;display:grid;place-items:center;font-weight:600;font-size:13px}
.top-sel .q{color:var(--petroleo);min-width:0}
.top-sel .q small{display:block;color:#8A8C86;font-size:12.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-sel .pct{text-align:right;font-weight:600;color:var(--petroleo);font-variant-numeric:tabular-nums}
.encuesta-fila{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid #F0F1EC;flex-wrap:wrap}
.encuesta-fila:last-child{border-bottom:0}
.encuesta-fila .ic{width:46px;height:46px;border-radius:12px;background:var(--verde-suave);color:#5E7A14;display:grid;place-items:center;flex:none}
.encuesta-fila .ic svg{width:22px;height:22px}
.encuesta-fila .tx{flex:1;min-width:200px}
.encuesta-fila .tx b{display:block;color:var(--petroleo);font-weight:500;font-size:16px}
.encuesta-fila .tx small{color:#8A8C86;font-size:13px}
.chip-e{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:500}
.chip-e.abierta{background:var(--verde-suave);color:#4E6A0E}.chip-e.borrador{background:#EEF0EA;color:var(--gris)}.chip-e.cerrada{background:#FBF0DC;color:#8A5A06}
.perfil{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.perfil .foto{width:96px;height:96px;border-radius:50%;background:var(--verde-suave);color:var(--petroleo);display:grid;place-items:center;font-size:36px;font-weight:500;overflow:hidden;flex:none;border:3px solid #fff;box-shadow:0 0 0 2px var(--verde-medio)}
.perfil .foto img{width:100%;height:100%;object-fit:cover}
.secs-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* tarjetas */

.editor{display:flex;flex-direction:column;gap:16px}
.fila{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.fila>*{min-width:0}
.grow{flex:1 1 260px}
textarea.titq{font-size:17px;min-height:56px;background:#F7F8F4}
.ops-ed{display:flex;flex-direction:column;gap:8px}
.op-ed{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.op-ed .marca{width:18px;height:18px;border:1.5px solid #C9CBC4;border-radius:50%;flex:none}

.ico{border:0;background:none;cursor:pointer;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--gris);flex:none}

/* respuestas */

.tabla th,.tabla td{padding:8px 10px;border-bottom:1px solid var(--gris-claro);text-align:left;vertical-align:top}
.tabla td.n{text-align:right;font-variant-numeric:tabular-nums}
.una{border-bottom:1px solid var(--gris-claro);padding:10px 0}
.una-cab{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.una-cab span{flex:1;min-width:160px;color:var(--petroleo)}
.una dl{margin:10px 0 0;display:grid;grid-template-columns:minmax(0,1fr);gap:4px;font-size:13.5px}

/* compartir */
.modal-fondo{position:fixed;inset:0;background:rgba(0,40,43,.45);z-index:20;display:grid;place-items:start center;overflow:auto;padding:30px 12px}

.modal-cab{display:flex;justify-content:space-between;align-items:center;gap:12px}
.link-gen{display:flex;gap:8px;flex-wrap:wrap}
.link-gen input{flex:1 1 260px}
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.area{border:1px solid var(--gris-claro);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.area .qr{width:150px;height:150px;display:grid;place-items:center}
.area .qr img,.area .qr canvas{width:150px!important;height:150px!important}
.area b{color:var(--petroleo);font-weight:500}
.area .acc{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--petroleo);color:var(--blanco);padding:11px 18px;border-radius:12px;font-size:14px;opacity:0;transition:all .3s var(--ease);z-index:30;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.vacio{text-align:center;padding:40px 20px;color:var(--gris)}
@media (max-width:560px){.bar{grid-template-columns:1fr 64px}.bar .tr{grid-column:1/-1;grid-row:2}.pie-ed .sep{display:none}}
h1[tabindex="-1"]:focus,h2[tabindex="-1"]:focus{outline:none}

<body>
<div id="app"></div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="lucide.min.js"></script>
<script src="config.js"></script>
<script>
"use strict";
const sb=supabase.createClient(CLIMA_CONFIG.url,CLIMA_CONFIG.key);
const $=s=>document.querySelector(s);
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LIKERT=["Totalmente de acuerdo","De acuerdo","Indiferente","En desacuerdo","Totalmente en desacuerdo"];
const EMOCIONES=["Feliz","Comprometido","Motivado","Satisfecho","Indiferente","Decepcionado","Frustrado","Aburrido","Estresado","Enfadado"];
const TIPOS={
  opcion:["Elegir una opción","La persona marca una sola respuesta"],
  multiple:["Elegir varias opciones","Puede marcar más de una"],
  likert:["De acuerdo / en desacuerdo","Escala de 5 puntos con Indiferente al centro"],
  escala:["Calificación del 1 al 10","Números para calificar, por ejemplo la recomendación"],
  emociones:["Emociones","Tarjetas con caritas para elegir cómo se siente"],
  abierta:["Respuesta escrita","La persona escribe con sus propias palabras"]
};
const LAPIZ='<svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M10.5 2.5 13.5 5.5 5.5 13.5H2.5V10.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>';
const ICO={
  arriba:'<svg width="16" height="16" viewBox="0 0 18 18" fill="none"><path d="M9 14V4m-4 4 4-4 4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  abajo:'<svg width="16" height="16" viewBox="0 0 18 18" fill="none"><path d="M9 4v10m-4-4 4 4 4-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  copiar:'<svg width="16" height="16" viewBox="0 0 18 18" fill="none"><rect x="6" y="6" width="9" height="9" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M3 12V4a1 1 0 0 1 1-1h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
  borrar:'<svg width="16" height="16" viewBox="0 0 18 18" fill="none"><path d="M4 5h10m-7 0V3.5h4V5m-6 0 .6 9.5h6.8L13 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  x:'<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="m4 4 8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>'
};
const editar=(foco,texto="Editar aquí")=>`<button type="button" class="editar" data-foco="${foco}">${LAPIZ} ${texto}</button>`;
const etiqueta=(texto,foco,ayuda="")=>`<div class="etq"><span><b>${texto}</b>${ayuda?` · ${ayuda}`:""}</span>${editar(foco)}</div>`;

let S={user:null,vista:"inicio",act:[],actError:false,encuestas:[],E:null,P:[],U:[],R:[],abierta:null,menuTipos:null,borrar:null,filtro:"",secEd:null,verResp:null};

const ACCIONES=[[/^Pregunta eliminada/,"eliminar","Eliminó una pregunta"],[/^Área eliminada/,"eliminar","Eliminó un área"],[/^Área agregada/,"crear","Agregó un área"],[/^Encuesta creada/,"crear","Creó una encuesta"],[/^Encuesta eliminada/,"eliminar","Eliminó una encuesta"],[/^Respuestas borradas/,"eliminar","Borró todas las respuestas"],[/^Respuesta eliminada/,"eliminar","Eliminó una respuesta"],[/^Sección quitada/,"eliminar","Quitó una sección"],[/^Sección creada/,"crear","Creó una sección"],[/^Pregunta ubicada/,"editar",null],[/^La encuesta está abierta/,"estado","Abrió la encuesta"],[/^La encuesta está cerrada/,"estado","Cerró la encuesta"],[/^La encuesta volvió a borrador/,"estado","Pasó la encuesta a borrador"]];
function toast(t){const m=ACCIONES.find(([r])=>r.test(t));if(m&&typeof registrar==="function")registrar(m[1],m[2]||t.replace(/\.$/,""));const el=$("#toast");el.textContent=t;el.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("on"),2800)}
function guardando(estado){const g=$("#guardado");if(g)g.textContent=estado}
function fallo(err,txt="No se pudo guardar"){console.error(err);toast(txt+". Revisa tu conexión e inténtalo de nuevo.");guardando("No se guardó el último cambio")}
const slugify=s=>String(s).normalize("NFKD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"area";
const baseURL=()=>location.href.replace(/admin\.html.*$/,"").replace(/[?#].*$/,"");
const cfgE=()=>{if(!S.E.config)S.E.config={};return S.E.config};
function leer(k){try{return localStorage.getItem(k)}catch{return null}}
function escribir(k,v){try{localStorage.setItem(k,v)}catch{}}

/* Botón "Editar aquí": lleva el cursor al campo y selecciona el texto */
document.addEventListener("click",e=>{
  const b=e.target.closest(".editar[data-foco]");if(!b)return;
  e.stopPropagation();
  const f=b.dataset.foco;
  if(f.startsWith("preg:")){abrirPregunta(f.slice(5));return}
  if(f.startsWith("sec:")){S.secEd=f.slice(4);S.abierta=null;pintarPreguntas();const i=$("#sec-nombre");if(i){i.focus();i.select()}return}
  const el=document.getElementById(f);if(el){el.focus();if(el.select)el.select();el.scrollIntoView({block:"center",behavior:"smooth"})}
},true);

/* ===================== sesión ===================== */
async function iniciar(){
  const {data:{session}}=await sb.auth.getSession();
  if(session) return entrar(session.user);
  pantallaLogin();
}
function pantallaLogin(msg=""){
  $("#app").innerHTML=`<div class="login"><section class="login-marca"><span class="l1"></span><span class="l2"></span><span class="barra"></span>
    <img src="logo-horizontal-blanco.png" alt="Garnier, Enhancing Land">
    <div><div class="eyebrow" style="color:var(--verde)">Encuesta de clima organizacional</div><h2 style="margin-top:12px">Panel de administración</h2></div>
    <p>Edita las preguntas, abre o cierra la encuesta, comparte los enlaces por área y revisa los resultados en un solo lugar.</p></section>
    <div class="login-form"><form id="f-login" novalidate>
    <div><h1>Iniciar sesión</h1><p class="nota" style="margin-top:6px">Usa el correo y la contraseña que te asignaron.</p></div>
    <label class="campo">Correo<input id="l-correo" type="email" autocomplete="username" required></label>
    <label class="campo">Contraseña<input id="l-clave" type="password" autocomplete="current-password" required></label>
    <div class="error" id="l-error">${esc(msg)}</div>
    <button class="cta" type="submit">Entrar</button>
  </form></div></div>`;
  $("#f-login").onsubmit=async e=>{
    e.preventDefault();const b=e.target.querySelector("button");b.disabled=true;b.textContent="Entrando…";
    const {data,error}=await sb.auth.signInWithPassword({email:$("#l-correo").value.trim(),password:$("#l-clave").value});
    if(error){b.disabled=false;b.textContent="Entrar";$("#l-error").textContent=/invalid/i.test(error.message)?"Correo o contraseña incorrectos.":"No se pudo entrar: "+error.message;return}
    entrar(data.user);
  };
}
async function entrar(user){
  const {data,error}=await sb.from("admins").select("email").limit(1);
  if(error||!data||!data.length){await sb.auth.signOut();return pantallaLogin("Esta cuenta no tiene acceso al panel.")}
  S.user=user;await cargarActividad();registrar("acceso","Accedió al panel");await cargarEncuestas();
}
async function salir(){await sb.auth.signOut();S.user=null;S.E=null;pantallaLogin()}

/* ===================== datos ===================== */
async function cargarEncuestas(idPreferida){
  const {data,error}=await sb.from("encuestas").select("*").order("creada_en",{ascending:false});
  if(error) return fallo(error,"No se pudieron cargar las encuestas");
  S.encuestas=data||[];
  const id=idPreferida||(S.E&&S.encuestas.some(e=>e.id===S.E.id)&&S.E.id)||(S.encuestas[0]&&S.encuestas[0].id);
  if(!id){S.E=null;return pintar()}
  await abrirEncuesta(id);
}
async function abrirEncuesta(id){
  S.E=S.encuestas.find(e=>e.id===id);S.abierta=null;S.menuTipos=null;S.borrar=null;S.secEd=null;S.verResp=null;S.filtro="";
  const [p,u,r]=await Promise.all([
    sb.from("preguntas").select("*").eq("encuesta_id",id).order("orden"),
    sb.from("unidades").select("*").eq("encuesta_id",id).order("orden"),
    sb.from("respuestas").select("*").eq("encuesta_id",id).order("enviada_en",{ascending:false})
  ]);
  if(p.error||u.error||r.error) return fallo(p.error||u.error||r.error,"No se pudo cargar la encuesta");
  S.P=p.data;S.U=u.data;S.R=r.data;pintar();
}
const pendientes={};
function guardarCampo(tabla,id,cambios,ms=600){
  guardando("Guardando…");
  const k=tabla+id;pendientes[k]={...(pendientes[k]||{}),...cambios};
  clearTimeout(pendientes[k+"t"]);
  pendientes[k+"t"]=setTimeout(async()=>{
    const c=pendientes[k];delete pendientes[k];
    if(tabla!=="unidades") c.actualizada_en=new Date().toISOString();
    const {error}=await sb.from(tabla).update(c).eq("id",id);
    if(error) return fallo(error);
    guardando("Todos los cambios se guardaron");
    registrar("guardar",describirCambio(tabla,id,c));
  },ms);
}
function describirCambio(tabla,id,c){
  if(tabla==="preguntas"){const i=S.P.findIndex(p=>p.id===id);return i>=0?`Editó la pregunta ${i+1}`:"Editó una pregunta"}
  if(tabla==="unidades"){const u=S.U.find(x=>x.id===id);return `Editó el área "${u?u.nombre:""}"`}
  if(c.config)return "Editó los mensajes de la encuesta";if(c.titulo!==undefined)return "Editó el título de la encuesta";if(c.descripcion!==undefined)return "Editó el mensaje de bienvenida";return "Editó la encuesta";
}
function guardarConfig(){guardarCampo("encuestas",S.E.id,{config:JSON.parse(JSON.stringify(cfgE()))})}
async function renumerar(){
  const cambios=S.P.map((p,i)=>({p,i:i+1})).filter(x=>x.p.orden!==x.i);
  cambios.forEach(x=>x.p.orden=x.i);
  if(!cambios.length)return;
  guardando("Guardando…");
  const res=await Promise.all(cambios.map(x=>sb.from("preguntas").update({orden:x.i}).eq("id",x.p.id)));
  const e=res.find(x=>x.error);if(e) return fallo(e.error);
  guardando("Todos los cambios se guardaron");
}

/* ===================== estructura general (dashboard) ===================== */
const IC=n=>`<i data-lucide="${n}"></i>`;
function iconos(){try{if(window.lucide&&document.querySelector("i[data-lucide]"))lucide.createIcons({attrs:{"stroke-width":1.8}})}catch(e){console.error(e)}}
new MutationObserver(()=>{clearTimeout(iconos.t);iconos.t=setTimeout(iconos,0)}).observe(document.documentElement,{childList:true,subtree:true});
const nombreUsuario=()=>{const m=(S.user&&S.user.user_metadata)||{};if(m.nombre)return m.nombre;const c=(S.user&&S.user.email)||"";const b=c.split("@")[0].replace(/[._-]+/g," ");return b.charAt(0).toUpperCase()+b.slice(1)};
const avatarHTML=()=>{const m=(S.user&&S.user.user_metadata)||{};return m.avatar?`<img src="${esc(m.avatar)}" alt="">`:esc(nombreUsuario().slice(0,1).toUpperCase())};
const metaPersonas=()=>Math.max(1,+(S.E&&cfgE().personas)||54);
const preguntasVisibles=()=>S.P.filter(p=>!sinTerminar(p));

function pintar(){
  if(!S.E&&!["encuestas","configuracion"].includes(S.vista)) S.vista="encuestas";
  $("#app").innerHTML=topbar()+subbar()+`<div class="marco3"><aside class="lateral" aria-label="Menú">${lateral()}</aside><main id="cuerpo"></main><aside class="riel" id="riel" aria-label="Actividad"></aside></div>`;
  enlazarCab();
  const V={inicio:pintarInicio,encuestas:pintarEncuestas,preguntas:pintarPreguntas,mensajes:pintarMensajes,respuestas:pintarRespuestas,reportes:pintarReportes,configuracion:pintarConfig};
  (V[S.vista]||pintarInicio)();
  pintarRiel();
}
function topbar(){
  const E=S.E,v=S.vista;
  const sinVer=(S.act||[]).filter(a=>new Date(a.creada_en).getTime()>(+leer("clima-act-visto")||0)).length;
  return `<header class="topbar"><div class="top-in">
    <div class="top-marca"><img src="logo-horizontal-blanco.png" alt="Garnier, Enhancing Land"><span class="div"></span><div class="app"><small>Clima organizacional</small><b>Panel de administración</b></div></div>
    <nav class="top-nav" aria-label="Principal">
      <button data-vista="inicio" class="${v==="inicio"?"on":""}">${IC("house")} Inicio</button>
      <button data-vista="encuestas" class="${v==="encuestas"?"on":""}">${IC("file-text")} Encuestas</button>
      ${E?`<div class="top-estado" role="group" aria-label="Estado de la encuesta">${[["borrador","pen-line","Borrador"],["abierta","circle-play","Abierta"],["cerrada","circle-stop","Cerrada"]].map(([s,i,t])=>`<button data-e="${s}" class="${E.estado===s?"on":""}">${IC(i)} ${t}</button>`).join("")}</div>
      <a href="index.html?previa=${E.id}" target="_blank" rel="noopener">${IC("eye")} Ver como el personal</a>
      <button data-vista="respuestas" class="${v==="respuestas"?"on":""}">${IC("chart-column")} Respuestas</button>`:""}
    </nav>
    <div class="top-der">
      <div class="buscar">${IC("search")}<input id="buscar" type="search" placeholder="Buscar preguntas…" autocomplete="off" aria-label="Buscar preguntas"><div class="desplegable" id="res-buscar" hidden></div></div>
      <div style="position:relative"><button class="campana" data-campana aria-label="Actividad reciente">${IC("bell")}${sinVer?`<span class="num">${sinVer>9?"9+":sinVer}</span>`:""}</button><div class="desplegable" id="d-campana" hidden></div></div>
      <div style="position:relative"><button class="usuario-btn" data-menu-usuario><span class="avatar">${avatarHTML()}</span><span class="nom">${esc(nombreUsuario())}</span>${IC("chevron-down")}</button>
        <div class="desplegable" id="d-usuario" hidden style="min-width:220px"><button data-vista="configuracion">${IC("settings")} Configuración de la cuenta</button><button data-salir>${IC("log-out")} Salir</button></div></div>
    </div>
  </div></header>`;
}
function subbar(){
  const E=S.E;const v=S.vista;
  return `<div class="subbar"><div class="sub-in">
    <div class="sel-enc"><span class="ic">${IC("clipboard-list")}</span><label for="sel-enc">Encuesta:</label><select id="sel-enc">${S.encuestas.map(e=>`<option value="${e.id}" ${E&&e.id===E.id?"selected":""}>${esc(e.titulo)}</option>`).join("")}<option value="__nueva">+ Crear otra encuesta…</option></select></div>
    ${E?`<nav class="tabs"><button data-vista="preguntas" class="${v==="preguntas"?"on":""}">Preguntas</button><button data-vista="mensajes" class="${v==="mensajes"?"on":""}">Mensajes y áreas</button><button data-vista="respuestas" class="${v==="respuestas"?"on":""}">Respuestas<span class="badge">${S.R.length}</span></button></nav>
    <span class="guardado" id="guardado">Todos los cambios se guardaron</span>
    <div class="sub-acc"><a class="btn" href="index.html?previa=${E.id}" target="_blank" rel="noopener">${IC("eye")} <span class="lbl">Ver como el personal</span></a><button class="cta sm" data-compartir>${IC("share-2")} <span class="lbl">Compartir</span></button><button class="btn" data-salir>${IC("log-out")} <span class="lbl">Salir</span></button></div>`:""}
  </div></div>`;
}
function lateral(){
  const v=S.vista;
  const it=(vista,ic,t,fin="")=>`<button data-vista="${vista}" class="${v===vista?"on":""}">${IC(ic)} ${t}${fin}</button>`;
  return `<nav class="menu">
    ${it("inicio","house","Inicio")}
    ${it("encuestas","file-text","Encuestas",`<span class="fin">${IC("chevron-right")}</span>`)}
    ${S.E?it("respuestas","chart-column","Respuestas",`<span class="badge">${S.R.length}</span>`):""}
    ${S.E?it("reportes","chart-line","Reportes",`<span class="fin">${IC("chevron-right")}</span>`):""}
    ${it("configuracion","settings","Configuración",`<span class="fin">${IC("chevron-right")}</span>`)}
  </nav>
  <div class="hoja-card">${IC("leaf")}<p>Juntos construimos un mejor ambiente laboral</p></div>`;
}
function irVista(v){S.vista=v;S.borrar=null;S.abierta=null;pintar();scrollTo({top:0})}
function enlazarCab(){
  document.querySelectorAll("[data-salir]").forEach(b=>b.onclick=salir);
  document.querySelectorAll("[data-nueva]").forEach(b=>b.onclick=()=>dialogoNueva());
  document.querySelectorAll("[data-vista]").forEach(b=>b.onclick=()=>irVista(b.dataset.vista));
  const sel=$("#sel-enc");if(sel)sel.onchange=async()=>{if(sel.value==="__nueva"){sel.value=S.E?S.E.id:"";dialogoNueva()}else{await abrirEncuesta(sel.value)}};
  document.querySelectorAll(".top-estado button").forEach(b=>b.onclick=()=>cambiarEstado(b.dataset.e));
  const c=document.querySelector("[data-compartir]");if(c)c.onclick=compartir;
  const alternar=(btnSel,id,alAbrir)=>{const b=$(btnSel),d=$(id);if(!b||!d)return;b.onclick=e=>{e.stopPropagation();const ab=d.hidden;document.querySelectorAll(".desplegable").forEach(x=>x.hidden=true);d.hidden=!ab;if(ab&&alAbrir)alAbrir(d)}};
  alternar("[data-menu-usuario]","#d-usuario");
  alternar("[data-campana]","#d-campana",d=>{d.innerHTML=`<div style="padding:6px 8px 4px;font-weight:600;color:var(--petroleo)">Actividad reciente</div>`+((S.act||[]).slice(0,12).map(actHTML).join("")||'<div class="vacio-d">Sin actividad todavía.</div>');escribir("clima-act-visto",String(Date.now()));const n=document.querySelector(".campana .num");if(n)n.remove()});
  const q=$("#buscar"),r=$("#res-buscar");
  if(q){q.oninput=()=>{const t=q.value.trim().toLowerCase();if(!t){r.hidden=true;return}
      const res=S.P.map((p,i)=>({p,i})).filter(x=>(x.p.titulo+" "+(x.p.seccion||"")).toLowerCase().includes(t)).slice(0,8);
      r.innerHTML=res.map(x=>`<button data-ir-preg="${x.p.id}">${IC("circle-help")}<span>${x.i+1}. ${esc(x.p.titulo)}<small>${esc(x.p.seccion||"Sin sección")}</small></span></button>`).join("")||'<div class="vacio-d">No hay preguntas con ese texto.</div>';
      r.hidden=false;r.querySelectorAll("[data-ir-preg]").forEach(b=>b.onclick=()=>{r.hidden=true;q.value="";S.vista="preguntas";pintar();abrirPregunta(b.dataset.irPreg)})};
    q.onkeydown=e=>{if(e.key==="Escape"){r.hidden=true;q.blur()}}}
}
document.addEventListener("click",e=>{if(!e.target.closest(".desplegable,[data-campana],[data-menu-usuario],.buscar"))document.querySelectorAll(".desplegable").forEach(x=>x.hidden=true)});

/* ---------- actividad reciente ---------- */
const ACT_IC={guardar:"check",editar:"info",crear:"plus",eliminar:"trash-2",acceso:"user-check",estado:"power"};
function hace(f){const s=Math.max(0,(Date.now()-new Date(f).getTime())/1000);if(s<60)return "Hace un momento";const m=Math.round(s/60);if(m<60)return `Hace ${m} min`;const h=Math.round(m/60);if(h<24)return `Hace ${h} h`;const d=Math.round(h/24);return d===1?"Ayer":`Hace ${d} días`}
function actHTML(a){return `<div class="act-it"><span class="act-ic ${esc(a.tipo)}">${IC(ACT_IC[a.tipo]||"info")}</span><span class="tx">${esc(a.accion)}<small>${esc(a.nombre||a.email||"")}</small></span><time>${hace(a.creada_en)}</time></div>`}
async function cargarActividad(){try{const {data,error}=await sb.from("actividad").select("*").order("creada_en",{ascending:false}).limit(40);S.act=error?[]:data||[];S.actError=!!error}catch(e){S.act=[];S.actError=true}}
async function registrar(tipo,accion){
  if(!S.user)return;
  const ult=(S.act||[])[0];
  if(ult&&ult.accion===accion&&Date.now()-new Date(ult.creada_en).getTime()<180000){ult.creada_en=new Date().toISOString();pintarRiel();return}
  const fila={tipo,accion,email:S.user.email,nombre:nombreUsuario()};
  S.act=[{...fila,creada_en:new Date().toISOString()},...(S.act||[])].slice(0,40);pintarRiel();
  try{await sb.from("actividad").insert(fila)}catch(e){}
}
function pintarRiel(){
  const r=$("#riel");if(!r)return;
  r.innerHTML=`<div class="cita"><div class="ico-c">${IC("sprout")}</div><blockquote>"Las grandes organizaciones se construyen con la opinión de su gente."</blockquote><hr></div>
    <div class="panel-c"><h3>${IC("clock")} Actividad reciente</h3><div class="act">${(S.act||[]).slice(0,7).map(actHTML).join("")||`<p class="nota">${S.actError?"Para guardar la actividad, ejecuta en Supabase la actualización 3 (archivo sql/3-actividad.sql).":"Aquí aparecerá cada cambio que se haga en el panel."}</p>`}</div></div>
    ${S.E?`<a class="opinion" href="index.html?previa=${S.E.id}" target="_blank" rel="noopener"><span class="ph"></span><b>Tu opinión<br>hace la diferencia</b><span class="ir">${IC("arrow-right")}</span></a>`:""}`;
}

/* ---------- cálculos para el resumen ---------- */
function favorable(preg,R){let fav=0,tot=0;preg.filter(p=>p.tipo==="likert"&&!sinTerminar(p)).forEach(p=>R.forEach(r=>{const v=r.datos[p.id];if(v){tot++;if(v==="Totalmente de acuerdo"||v==="De acuerdo")fav++}}));return tot?Math.round(fav/tot*100):null}
function nivel(p){return p===null?"nivel-0":p>=80?"nivel-a":p>=60?"nivel-m":"nivel-b"}
function porSeccion(R){return secciones().map(s=>({s,n:S.P.filter(p=>p.seccion===s&&!sinTerminar(p)).length,f:favorable(S.P.filter(p=>p.seccion===s),R)})).filter(x=>S.P.some(p=>p.seccion===x.s&&p.tipo==="likert"&&!sinTerminar(p)))}
function donaHTML(resp,meta){
  const pct=Math.min(100,Math.round(resp/meta*100));const C=2*Math.PI*80;
  return `<div class="dona"><svg viewBox="0 0 190 190"><circle cx="95" cy="95" r="80" fill="none" stroke="#E6E7E3" stroke-width="22"/><circle cx="95" cy="95" r="80" fill="none" stroke="#003C40" stroke-width="22" stroke-linecap="${pct<5?"butt":"round"}" stroke-dasharray="${(C*pct/100).toFixed(1)} ${C.toFixed(1)}"/></svg><div class="centro"><div><strong>${pct}%</strong><span>Completado</span></div></div></div>`;
}
function tarjetaProgreso(){
  const n=S.R.length,meta=metaPersonas();
  return `<div class="tarjeta-d"><h3>Progreso de la encuesta<span class="leyenda"><span><i style="background:#003C40"></i>Respondidas</span><span><i style="background:#E6E7E3"></i>Pendientes</span></span></h3>
    <div class="dona-caja">${donaHTML(n,meta)}<div class="dona-datos"><div><strong>${n}</strong><span>Respuestas recibidas</span></div><div><strong>${Math.max(0,meta-n)}</strong><span>Personas pendientes de ${meta}</span></div></div></div></div>`;
}
function tarjetaSecciones(R){
  const filas=porSeccion(R);
  return `<div class="tarjeta-d"><h3>Resultados por sección<span class="leyenda"><span><i class="nivel-a"></i>80 % o más</span><span><i class="nivel-m"></i>60–79 %</span><span><i class="nivel-b"></i>Menos de 60 %</span></span></h3>
    <div class="barras">${filas.map(x=>`<div class="barra-s" title="${esc(x.s)}"><span class="n">${esc(x.s)}</span><span class="t"><i class="${nivel(x.f)}" style="width:${x.f??0}%"></i></span><span class="v">${x.f===null?`0/${x.n}`:x.f+" %"}</span></div>`).join("")||'<p class="nota">Aún no hay secciones con preguntas de acuerdo/desacuerdo.</p>'}</div>
    <p class="nota" style="margin-top:12px">Porcentaje favorable: personas que respondieron "De acuerdo" o "Totalmente de acuerdo".</p></div>`;
}

/* ===================== INICIO ===================== */
function pintarInicio(){
  const c=$("#cuerpo");if(!S.E){pintarEncuestas();return}
  const E=S.E,n=S.R.length,meta=metaPersonas(),pct=Math.min(100,Math.round(n/meta*100));
  const areasCon=new Set(S.R.map(r=>r.unidad).filter(Boolean)).size;
  const estadoTxt={abierta:"Encuesta activa",borrador:"En borrador",cerrada:"Encuesta cerrada"}[E.estado];
  c.innerHTML=`<section class="hero"><span class="pill-estado ${E.estado}">${estadoTxt}</span><div><h1>${IC("sprout")} Hola, ${esc(nombreUsuario())}</h1><p>Aquí tienes un resumen del progreso de la ${esc(E.titulo.charAt(0).toLowerCase()+E.titulo.slice(1))}.</p></div></section>
  <div class="kpis4">
    <button class="kpi4" data-vista="preguntas"><div class="cab-k"><span class="ic a">${IC("list-checks")}</span><span class="t">Total de preguntas</span>${IC("chevron-right")}</div><strong>${preguntasVisibles().length}</strong></button>
    <button class="kpi4" data-vista="respuestas"><div class="cab-k"><span class="ic b">${IC("clipboard-list")}</span><span class="t">Respuestas recibidas</span>${IC("chevron-right")}</div><strong>${n} <small>/ ${meta}</small></strong><div class="prog"><i style="width:${pct}%"></i></div></button>
    <button class="kpi4" data-vista="reportes"><div class="cab-k"><span class="ic c">${IC("gauge")}</span><span class="t">Avance general</span>${IC("chevron-right")}</div><strong>${pct}%</strong><div class="prog"><i style="width:${pct}%"></i></div></button>
    <button class="kpi4" data-vista="mensajes"><div class="cab-k"><span class="ic d">${IC("users")}</span><span class="t">Áreas participantes</span>${IC("chevron-right")}</div><strong>${areasCon} <small>/ ${S.U.length}</small></strong></button>
  </div>
  <div class="dos">${tarjetaProgreso()}${tarjetaSecciones(S.R)}</div>`;
  c.querySelectorAll("[data-vista]").forEach(b=>b.onclick=()=>irVista(b.dataset.vista));
}

/* ===================== ENCUESTAS ===================== */
async function pintarEncuestas(){
  const c=$("#cuerpo");
  c.innerHTML=`<div class="tarjeta-d"><h3>Encuestas<button class="cta sm" data-nueva-enc>${IC("plus")} Crear otra encuesta</button></h3><div id="lista-enc"><p class="nota">Cargando…</p></div></div>`;
  c.querySelector("[data-nueva-enc]").onclick=dialogoNueva;
  const {data}=await sb.from("respuestas").select("encuesta_id");
  const cuenta={};(data||[]).forEach(r=>cuenta[r.encuesta_id]=(cuenta[r.encuesta_id]||0)+1);
  const l=$("#lista-enc");if(!l)return;
  l.innerHTML=S.encuestas.map(e=>`<div class="encuesta-fila"><span class="ic">${IC("file-text")}</span><div class="tx"><b>${esc(e.titulo)}</b><small>Creada el ${new Date(e.creada_en).toLocaleDateString("es-CR",{dateStyle:"long"})} · ${cuenta[e.id]||0} respuestas</small></div>
    <span class="chip-e ${e.estado}">${{abierta:"Abierta",borrador:"Borrador",cerrada:"Cerrada"}[e.estado]}</span>
    <button class="btn sm" data-abrir-enc="${e.id}">${IC("pencil")} ${S.E&&S.E.id===e.id?"Editar (abierta en el panel)":"Abrir y editar"}</button></div>`).join("")||'<p class="nota">Todavía no hay encuestas. Crea la primera.</p>';
  l.querySelectorAll("[data-abrir-enc]").forEach(b=>b.onclick=async()=>{S.vista="preguntas";await abrirEncuesta(b.dataset.abrirEnc)});
}

/* ===================== REPORTES ===================== */
function pintarReportes(){
  const c=$("#cuerpo");const R=S.R;
  const conteo={};R.forEach(r=>{const a=r.unidad||"Sin área";conteo[a]=(conteo[a]||0)+1});
  const max=Math.max(1,...Object.values(conteo));
  const nps=S.P.find(p=>p.tipo==="escala"&&p.config&&p.config.nps);
  let npsHTML='<p class="nota">No hay una pregunta marcada para calcular el NPS.</p>';
  if(nps){const v=R.map(r=>r.datos[nps.id]).filter(x=>x!==undefined&&x!=="");if(v.length){const pro=v.filter(x=>x>=9).length,det=v.filter(x=>x<=6).length;const val=Math.round((pro-det)/v.length*100);
    npsHTML=`<div class="kpis4" style="margin-top:0;grid-template-columns:repeat(4,minmax(0,1fr))"><div class="kpi4" style="cursor:default"><span class="t">NPS</span><strong>${val}</strong></div><div class="kpi4" style="cursor:default"><span class="t">Promotores (9–10)</span><strong>${pro}</strong></div><div class="kpi4" style="cursor:default"><span class="t">Pasivos (7–8)</span><strong>${v.length-pro-det}</strong></div><div class="kpi4" style="cursor:default"><span class="t">Detractores (1–6)</span><strong>${det}</strong></div></div>`}else npsHTML='<p class="nota">Sin respuestas todavía.</p>'}
  c.innerHTML=`<div class="tarjeta-d"><h3>Reportes de ${esc(S.E.titulo)}<button class="btn sm" data-excel-r>${IC("download")} Descargar Excel</button></h3><p class="nota">Resumen de toda la empresa. Para ver una sola área, usa el filtro en <b>Respuestas</b>.</p></div>
  <div class="dos">${tarjetaProgreso()}<div class="tarjeta-d"><h3>Participación por área</h3><div class="barras">${Object.entries(conteo).sort((a,b)=>b[1]-a[1]).map(([a,n])=>`<div class="barra-s"><span class="n">${esc(a)}</span><span class="t"><i class="nivel-a" style="width:${n/max*100}%"></i></span><span class="v">${n}</span></div>`).join("")||'<p class="nota">Sin respuestas todavía.</p>'}</div></div></div>
  <div class="dos">${tarjetaSecciones(R)}<div class="tarjeta-d"><h3>Índice de recomendación (NPS)</h3>${npsHTML}</div></div>`;
  c.querySelector("[data-excel-r]").onclick=descargarExcel;
}

/* ===================== CONFIGURACIÓN ===================== */
function pintarConfig(){
  const c=$("#cuerpo");const m=(S.user&&S.user.user_metadata)||{};
  c.innerHTML=`<div class="tarjeta-d"><h3>Mi perfil</h3>
    <div class="perfil"><div class="foto" id="foto-prev">${avatarHTML()}</div><div style="display:flex;flex-direction:column;gap:8px"><label class="btn" style="cursor:pointer">${IC("image-plus")} Cambiar foto<input type="file" id="foto" accept="image/*" hidden></label>${m.avatar?`<button class="link" data-quitar-foto>Quitar foto</button>`:""}</div></div>
    <div class="fila" style="margin-top:18px"><div class="campo grow">${etiqueta("Nombre que se muestra","cfg-nombre")}<input class="txt" id="cfg-nombre" value="${esc(m.nombre||"")}" placeholder="${esc(nombreUsuario())}"></div>
    <label class="campo grow">Correo (para iniciar sesión)<input class="txt" value="${esc(S.user.email)}" readonly style="background:#F4F6F1"></label></div>
    <div style="margin-top:14px"><button class="cta sm" data-guardar-perfil>${IC("check")} Guardar perfil</button></div></div>
  <div class="tarjeta-d" style="margin-top:16px"><h3>Cambiar contraseña</h3>
    <div class="fila"><label class="campo grow">Nueva contraseña<input class="txt" type="password" id="clave1" autocomplete="new-password"></label><label class="campo grow">Repite la nueva contraseña<input class="txt" type="password" id="clave2" autocomplete="new-password"></label></div>
    <p class="nota" style="margin-top:8px">Mínimo 8 caracteres.</p><div style="margin-top:10px"><button class="btn" data-clave>${IC("lock")} Cambiar contraseña</button></div></div>
  ${S.E?`<div class="tarjeta-d" style="margin-top:16px"><h3>Encuesta actual</h3><div class="campo" style="max-width:360px">${etiqueta("Personas invitadas","cfg-personas","para calcular el avance")}<input class="txt" type="number" min="1" id="cfg-personas" value="${metaPersonas()}"></div></div>`:""}`;
  let fotoNueva=undefined;
  $("#foto").onchange=e=>{const f=e.target.files[0];if(!f)return;const img=new Image();img.onload=()=>{const k=document.createElement("canvas");k.width=k.height=128;const x=k.getContext("2d");const s=Math.min(img.width,img.height);x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,128,128);fotoNueva=k.toDataURL("image/jpeg",.78);$("#foto-prev").innerHTML=`<img src="${fotoNueva}" alt="">`;toast("Toca Guardar perfil para conservar la foto.")};img.src=URL.createObjectURL(f)};
  const qf=c.querySelector("[data-quitar-foto]");if(qf)qf.onclick=()=>{fotoNueva=null;$("#foto-prev").textContent=nombreUsuario().slice(0,1).toUpperCase()};
  c.querySelector("[data-guardar-perfil]").onclick=async()=>{

/* ===================== lo más seleccionado ===================== */
function masSeleccionadas(R){
  const filas=[];
  S.P.forEach((p,i)=>{if(!["opcion","likert","emociones","escala","multiple"].includes(p.tipo))return;
    const cnt={};let tot=0;R.forEach(r=>{const v=r.datos[p.id];if(v===undefined||v==="")return;tot++;(Array.isArray(v)?v:[v]).forEach(x=>cnt[x]=(cnt[x]||0)+1)});
    if(!tot)return;const [op,n]=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];filas.push({i,p,op,n,tot,pct:Math.round(n/tot*100)})});
  return filas.sort((a,b)=>b.pct-a.pct||b.n-a.n);
}
function tarjetaMasSeleccionadas(R){
  const f=masSeleccionadas(R).slice(0,10);
  return `<div class="tarjeta-d" style="margin-top:16px"><h3 style="justify-content:flex-start">${IC("trophy")} Respuestas más seleccionadas</h3>
    <p class="nota" style="margin:-6px 0 8px">La opción que más eligieron en cada pregunta, ordenadas por el porcentaje de personas que coincidieron. No se muestra quién respondió.</p>
    <div class="top-sel">${f.map((x,k)=>`<div class="fila-s"><span class="pos">${k+1}</span><span class="q">${esc(String(x.op))}<small>P${x.i+1}. ${esc(x.p.titulo)}</small></span><span class="prog"><i style="width:${x.pct}%"></i></span><span class="pct">${x.pct}%</span></div>`).join("")||'<p class="nota">Sin respuestas todavía.</p>'}</div></div>`;
}

async function cambiarEstado(estado){
  const E=S.E;if(E.estado===estado)return;
  if(estado==="abierta"){
    for(const o of S.encuestas.filter(e=>e.id!==E.id&&e.estado==="abierta")){await sb.from("encuestas").update({estado:"cerrada"}).eq("id",o.id);o.estado="cerrada"}

    <p class="nota">Copiar es lo más práctico para el año siguiente: se mantienen las preguntas, los mensajes y las áreas, y empiezas sin respuestas. Después puedes cambiar lo que quieras.</p></div>`;

async function nuevaEncuesta(copiar,titulo){
  titulo=(titulo||"Nueva encuesta").trim();
  guardando("Creando…");
  const fila={titulo,descripcion:copiar&&S.E?S.E.descripcion:"",estado:"borrador"};
  if(copiar&&S.E&&S.E.config) fila.config=S.E.config;
  const {data:e,error}=await sb.from("encuestas").insert(fila).select().single();
  if(error) return fallo(error,"No se pudo crear la encuesta");
  if(copiar&&S.E){
    if(S.P.length){
      const filas=S.P.map(p=>({encuesta_id:e.id,orden:p.orden,seccion:p.seccion,descripcion_seccion:p.descripcion_seccion,tipo:p.tipo,titulo:p.titulo,ayuda:p.ayuda,opciones:p.opciones,obligatoria:p.obligatoria,config:{...p.config,saltos:undefined}}));
      const {data:nuevas,error:e2}=await sb.from("preguntas").insert(filas).select();
      if(e2) return fallo(e2);
      const mapa={};S.P.forEach(p=>{const n=nuevas.find(x=>x.orden===p.orden);if(n)mapa[p.id]=n.id});
      for(const p of S.P){const s=p.config&&p.config.saltos;if(s&&Object.keys(s).length){const ns={};for(const k in s)if(mapa[s[k]])ns[k]=mapa[s[k]];const n=nuevas.find(x=>x.orden===p.orden);await sb.from("preguntas").update({config:{...n.config,saltos:ns}}).eq("id",n.id)}}
    }
    if(S.U.length) await sb.from("unidades").insert(S.U.map(u=>({encuesta_id:e.id,slug:u.slug,nombre:u.nombre,orden:u.orden})));
  }
  S.vista="preguntas";await cargarEncuestas(e.id);toast("Encuesta creada en borrador.");
}

function enlazarSeccion(el){
  const viejo=S.secEd;
  const nombre=$("#sec-nombre"),intro=$("#sec-intro");
  intro.oninput=()=>{const c=cfgE();c.secciones={...(c.secciones||{})};c.secciones[S.secEd]=intro.value;guardarConfig()};
  const renombrar=async()=>{
    const nuevo=nombre.value.trim();if(!nuevo||nuevo===S.secEd)return;
    const actual=S.secEd;const afectadas=S.P.filter(p=>p.seccion===actual);
    afectadas.forEach(p=>p.seccion=nuevo);
    const c=cfgE();c.secciones={...(c.secciones||{})};if(c.secciones[actual]!==undefined){c.secciones[nuevo]=c.secciones[actual];delete c.secciones[actual]}
    S.secEd=nuevo;guardando("Guardando…");
    const res=await Promise.all(afectadas.map(p=>sb.from("preguntas").update({seccion:nuevo}).eq("id",p.id)));
    const e=res.find(x=>x.error);if(e)return fallo(e.error);
    guardarConfig();registrar("editar",`Renombró la sección "${nuevo}"`);
  };
  nombre.onchange=renombrar;
  el.querySelector("[data-sec-listo]").onclick=async()=>{await renombrar();S.secEd=null;S.borrar=null;pintarPreguntas()};
  el.querySelector("[data-sec-quitar]").onclick=()=>{S.borrar="sec:"+viejo;pintarPreguntas()};
  const si=el.querySelector("[data-sec-quitar-si]");if(si)si.onclick=async()=>{
    const af=S.P.filter(p=>p.seccion===viejo);af.forEach(p=>p.seccion=null);
    const res=await Promise.all(af.map(p=>sb.from("preguntas").update({seccion:null}).eq("id",p.id)));
    const e=res.find(x=>x.error);if(e)return fallo(e.error);
    const c=cfgE();if(c.secciones){c.secciones={...c.secciones};delete c.secciones[viejo];guardarConfig()}
    S.secEd=null;S.borrar=null;pintarPreguntas();toast("Sección quitada. Las preguntas se conservaron.");
  };
  const no=el.querySelector("[data-sec-quitar-no]");if(no)no.onclick=()=>{S.borrar=null;pintarPreguntas()};
}

function enlazarEditor(el){
  const p=S.P.find(x=>x.id===el.dataset.id);const i=S.P.indexOf(p);
  const g=c=>{Object.assign(p,c);guardarCampo("preguntas",p.id,c)};
  el.querySelector("[data-titulo]").oninput=e=>g({titulo:e.target.value});
  enlazarUbicacion(el,p);
  el.querySelector("[data-ayuda]").oninput=e=>g({ayuda:e.target.value||null});
  el.querySelector("[data-obl]").onchange=e=>g({obligatoria:e.target.checked});
  el.querySelector("[data-tipo]").onchange=e=>{
    const t=e.target.value;const c={tipo:t};
    if(t==="likert") c.opciones=LIKERT;
    else if(t==="emociones") c.opciones=EMOCIONES;
    else if((t==="opcion"||t==="multiple")&&(!p.opciones||!p.opciones.length||p.tipo==="likert"||p.tipo==="emociones")) c.opciones=["Opción 1","Opción 2"];
    else if(t==="escala"||t==="abierta") c.opciones=[];
    c.config=t==="escala"?{min:1,max:10,etiqueta_min:"Nada probable",etiqueta_max:"Muy probable"}:{};
    g(c);pintarPreguntas();
  };
  const ops=()=>Array.isArray(p.opciones)?[...p.opciones]:[];
  el.querySelectorAll("[data-op]").forEach(inp=>inp.oninput=e=>{
    const k=+inp.dataset.op;const a=ops();const viejo=a[k];a[k]=e.target.value;
    const cfg={...p.config};if(cfg.saltos&&cfg.saltos[viejo]){cfg.saltos={...cfg.saltos};cfg.saltos[a[k]]=cfg.saltos[viejo];delete cfg.saltos[viejo]}
    g({opciones:a,config:cfg});
  });
  el.querySelectorAll("[data-op-borrar]").forEach(b=>b.onclick=()=>{const k=+b.dataset.opBorrar;const a=ops();const [q]=a.splice(k,1);const cfg={...p.config};if(cfg.saltos){cfg.saltos={...cfg.saltos};delete cfg.saltos[q]}g({opciones:a,config:cfg});pintarPreguntas()});
  el.querySelectorAll("[data-op-arriba]").forEach(b=>b.onclick=()=>{const k=+b.dataset.opArriba;const a=ops();[a[k-1],a[k]]=[a[k],a[k-1]];g({opciones:a});pintarPreguntas()});
  const ag=el.querySelector("[data-op-agregar]");if(ag)ag.onclick=()=>{const a=ops();a.push("Opción "+(a.length+1));g({opciones:a});pintarPreguntas();const u=document.getElementById(`op-${p.id}-${a.length-1}`);if(u){u.focus();u.select()}};
  const lk=el.querySelector("[data-likert]");if(lk)lk.onclick=()=>{g({opciones:LIKERT});pintarPreguntas()};
  el.querySelectorAll("[data-salto]").forEach(s=>s.onchange=()=>{const k=+s.dataset.salto;const o=ops()[k];const cfg={...p.config,saltos:{...(p.config.saltos||{})}};if(s.value)cfg.saltos[o]=s.value;else delete cfg.saltos[o];g({config:cfg})});
  const bif=el.querySelector("[data-bif]");if(bif)bif.onchange=e=>{const cfg={...p.config,bifurcacion:e.target.checked};if(!e.target.checked)delete cfg.saltos;g({config:cfg});pintarPreguntas()};
  el.querySelectorAll("[data-cfg]").forEach(inp=>inp.oninput=inp.onchange=()=>{const v=inp.tagName==="SELECT"?+inp.value:inp.value;g({config:{...p.config,[inp.dataset.cfg]:v}})});
  const mn=el.querySelector("[data-minimo]");if(mn)mn.oninput=()=>g({config:{...p.config,minimo:Math.max(0,+mn.value||0)}});
  const nps=el.querySelector("[data-nps]");if(nps)nps.onchange=e=>g({config:{...p.config,nps:e.target.checked}});
  el.querySelectorAll("[data-mover]").forEach(b=>b.onclick=async()=>{const j=i+(+b.dataset.mover);if(j<0||j>=S.P.length)return;[S.P[i],S.P[j]]=[S.P[j],S.P[i]];pintarPreguntas();await renumerar();registrar("editar","Cambió el orden de las preguntas")});
  el.querySelector("[data-duplicar]").onclick=()=>insertarPregunta(i,{...p,titulo:p.titulo+" (copia)",config:{...p.config,saltos:undefined}});
  el.querySelector("[data-borrar]").onclick=()=>{S.borrar=p.id;pintarPreguntas()};
  const si=el.querySelector("[data-borrar-si]");if(si)si.onclick=()=>borrarPregunta(p);
  const no=el.querySelector("[data-borrar-no]");if(no)no.onclick=()=>{S.borrar=null;pintarPreguntas()};
  el.querySelector("[data-listo]").onclick=()=>{S.abierta=null;S.borrar=null;pintarPreguntas()};
}
/* --- ubicación: sección + lugar dentro de la sección --- */
const ORDINAL=["Primera","Segunda","Tercera","Cuarta","Quinta","Sexta","Séptima","Octava","Novena","Décima"];
function enlazarUbicacion(el,p){
  const selSec=el.querySelector("[data-ub-sec]"),selPos=el.querySelector("[data-ub-pos]"),nueva=el.querySelector("[data-ub-nueva]"),nota=el.querySelector("[data-ub-nota]");
  const seccionElegida=()=>selSec.value==="__nueva"?(nueva.value.trim()||"__nueva"):(selSec.value||null);
  const llenar=()=>{
    nueva.hidden=selSec.value!=="__nueva";
    const sec=seccionElegida();
    const otras=S.P.filter(q=>q.id!==p.id&&(q.seccion||null)===(sec==="__nueva"?"__ninguna__":sec));
    const actual=(p.seccion||null)===sec?S.P.filter(q=>(q.seccion||null)===sec).indexOf(p):otras.length;
    selPos.innerHTML=otras.map((q,k)=>`<option value="${k}" ${k===actual?"selected":""}>${ORDINAL[k]||(k+1)+".ª"} pregunta · antes de "${esc(q.titulo.slice(0,40))}${q.titulo.length>40?"…":""}"</option>`).join("")
      +`<option value="${otras.length}" ${actual>=otras.length?"selected":""}>${otras.length?"Al final de la sección":"Primera pregunta de la sección"}</option>`;
    nota.textContent="";
  };
  selSec.onchange=()=>{llenar();if(selSec.value==="__nueva"){nueva.focus()}};
  nueva.oninput=()=>{nota.textContent=""};
  llenar();
  el.querySelector("[data-ub-guardar]").onclick=async()=>{
    let sec=seccionElegida();
    if(sec==="__nueva"){nueva.focus();nota.textContent="Escribe el nombre de la sección nueva.";return}
    const k=+selPos.value;
    const resto=S.P.filter(q=>q.id!==p.id);
    const otras=resto.filter(q=>(q.seccion||null)===sec);
    let idx;
    if(!otras.length) idx=resto.length;
    else if(k<otras.length) idx=resto.indexOf(otras[k]);
    else idx=resto.indexOf(otras[otras.length-1])+1;
    resto.splice(idx,0,p);S.P=resto;
    const cambioSec=(p.seccion||null)!==sec;p.seccion=sec;
    guardando("Guardando…");
    if(cambioSec){const {error}=await sb.from("preguntas").update({seccion:sec}).eq("id",p.id);if(error)return fallo(error)}
    await renumerar();guardando("Todos los cambios se guardaron");
    pintarPreguntas();
    const n=S.P.indexOf(p)+1;toast(`Pregunta ubicada${sec?" en "+sec:""} como la número ${n}.`);
  };
}
function plantilla(tipo){
  const base={titulo:"Escribe aquí tu pregunta",tipo,obligatoria:true,ayuda:null,opciones:[],config:{}};
  if(tipo==="opcion"||tipo==="multiple") base.opciones=["Opción 1","Opción 2"];
  if(tipo==="likert") base.opciones=LIKERT;
  if(tipo==="emociones") base.opciones=EMOCIONES;
  if(tipo==="escala") base.config={min:1,max:10,etiqueta_min:"Nada probable",etiqueta_max:"Muy probable"};
  if(tipo==="abierta") base.config={minimo:10};
  return base;
}
function agregarPregunta(pos,tipo){const ref=S.P[pos];insertarPregunta(pos,{...plantilla(tipo),seccion:ref?ref.seccion:null})}
async function insertarPregunta(pos,datos){
  guardando("Guardando…");
  const fila={encuesta_id:S.E.id,orden:pos+2,seccion:datos.seccion??null,descripcion_seccion:datos.descripcion_seccion??null,tipo:datos.tipo,titulo:datos.titulo,ayuda:datos.ayuda??null,opciones:datos.opciones||[],obligatoria:!!datos.obligatoria,config:JSON.parse(JSON.stringify(datos.config||{}))};
  const {data,error}=await sb.from("preguntas").insert(fila).select().single();
  if(error) return fallo(error);
  registrar("crear","Agregó una pregunta");
  S.P.splice(pos+1,0,data);S.abierta=data.id;S.menuTipos=null;S.secEd=null;pintarPreguntas();
  await renumerar();
  const a=document.querySelector(".preg.abierta [data-titulo]");if(a){a.focus();a.select();a.scrollIntoView({block:"center",behavior:"smooth"})}
}
async function borrarPregunta(p){
  guardando("Guardando…");
  const {error}=await sb.from("preguntas").delete().eq("id",p.id);
  if(error) return fallo(error);
  S.P=S.P.filter(x=>x.id!==p.id);
  for(const q of S.P){const s=q.config&&q.config.saltos;if(s&&Object.values(s).includes(p.id)){const ns={...s};for(const k in ns)if(ns[k]===p.id)delete ns[k];q.config={...q.config,saltos:ns};await sb.from("preguntas").update({config:q.config}).eq("id",q.id)}}
  S.abierta=null;S.borrar=null;pintarPreguntas();await renumerar();toast("Pregunta eliminada.");
}

    S.P.forEach((p,i)=>html+=resumenPregunta(p,i,R));
    html+=`<div class="tarjeta res"><h3>Respuestas una por una</h3><p class="meta">Puedes revisar o eliminar respuestas individuales, por ejemplo las de prueba.</p>${R.map((r,k)=>unaHTML(r,R.length-k)).join("")}</div>`;
    html+=`<div class="tarjeta res"><h3>Borrar todas las respuestas</h3><p class="meta">Útil después de las pruebas, antes de abrir la encuesta al personal.</p>
      ${S.borrar==="__resp"?`<div class="confirmar">¿Borrar las ${S.R.length} respuestas? No se puede deshacer. <button class="btn peligro sm" data-limpiar-si>Sí, borrar todo</button><button class="btn sm" data-limpiar-no>Cancelar</button></div>`:`<button class="btn peligro" data-limpiar>${ICO.borrar} Borrar todas las respuestas</button>`}</div>`;
  }
  c.innerHTML=html;
  const conteoL={};S.R.forEach(r=>{const a=r.unidad||"Sin área";conteoL[a]=(conteoL[a]||0)+1});
  pintarLado(ladoResumen()+`<div class="lado-card"><h4>Ver resultados de</h4><div class="indice"><button data-filtro="" class="${S.filtro?"":"on"}">Toda la empresa<span>${S.R.length}</span></button>${Object.keys(conteoL).sort().map(a=>`<button data-filtro="${esc(a)}" class="${S.filtro===a?"on":""}">${esc(a)}<span>${conteoL[a]}</span></button>`).join("")}</div></div>
    <div class="lado-card" style="display:flex;flex-direction:column;gap:8px"><button class="cta sm" data-lado-excel>Descargar Excel</button><button class="btn" data-lado-act>Actualizar</button></div>`);
  document.querySelectorAll("[data-filtro]").forEach(b=>b.onclick=()=>{S.filtro=b.dataset.filtro;pintarRespuestas();scrollTo({top:0,behavior:"smooth"})});
  $("#filtro").onchange=e=>{S.filtro=e.target.value;pintarRespuestas()};
  c.querySelector("[data-excel]").onclick=descargarExcel;
  c.querySelector("[data-recargar]").onclick=async()=>{await abrirEncuesta(S.E.id);S.vista="respuestas";pintar();toast("Respuestas actualizadas.")};
  const l=c.querySelector("[data-limpiar]");if(l)l.onclick=()=>{S.borrar="__resp";pintarRespuestas()};
  const ln=c.querySelector("[data-limpiar-no]");if(ln)ln.onclick=()=>{S.borrar=null;pintarRespuestas()};
  const ls=c.querySelector("[data-limpiar-si]");if(ls)ls.onclick=async()=>{const {error}=await sb.from("respuestas").delete().eq("encuesta_id",S.E.id);if(error)return fallo(error,"No se pudieron borrar");S.borrar=null;S.R=[];pintar();toast("Respuestas borradas.")};
  c.querySelectorAll(".una").forEach(el=>{
    const r=S.R.find(x=>x.id===el.dataset.r);
    el.querySelector("[data-ver]").onclick=()=>{S.verResp=S.verResp===r.id?null:r.id;pintarRespuestas()};
    el.querySelector("[data-una-borrar]").onclick=()=>{S.borrar="r:"+r.id;pintarRespuestas()};
    const si=el.querySelector("[data-una-si]");if(si)si.onclick=async()=>{const {error}=await sb.from("respuestas").delete().eq("id",r.id);if(error)return fallo(error,"No se pudo eliminar");S.R=S.R.filter(x=>x.id!==r.id);S.borrar=null;pintar();toast("Respuesta eliminada.")};
    const no=el.querySelector("[data-una-no]");if(no)no.onclick=()=>{S.borrar=null;pintarRespuestas()};
  });
}
function unaHTML(r,n){
  const f=new Date(r.enviada_en).toLocaleString("es-CR",{dateStyle:"medium",timeStyle:"short"});
  const abierta=S.verResp===r.id;
  return `<div class="una" data-r="${r.id}"><div class="una-cab"><span>#${n} · ${f} · ${esc(r.unidad||"Sin área")}</span>
    <button class="btn sm" data-ver>${abierta?"Ocultar":"Ver"}</button><button class="btn sm peligro" data-una-borrar>${ICO.borrar} Eliminar</button></div>
    ${S.borrar==="r:"+r.id?`<div class="confirmar" style="margin-top:8px">¿Eliminar esta respuesta? <button class="btn peligro sm" data-una-si>Sí, eliminar</button><button class="btn sm" data-una-no>Cancelar</button></div>`:""}
    ${abierta?`<dl>${S.P.filter(p=>r.datos[p.id]!==undefined).map(p=>{const v=r.datos[p.id];return `<dt>${S.P.indexOf(p)+1}. ${esc(p.titulo)}</dt><dd>${esc(Array.isArray(v)?v.join(", "):v)}</dd>`}).join("")||"<dd>Sin datos</dd>"}</dl>`:""}</div>`;
}
function barra(et,n,tot){const pct=tot?n/tot*100:0;return `<div class="bar"><span class="et">${esc(et)}</span><span class="tr"><i style="width:${pct.toFixed(1)}%"></i></span><span class="vl">${n} · ${pct.toFixed(pct%1?1:0)}%</span></div>`}
function resumenPregunta(p,i,R){
  const vals=R.map(r=>r.datos[p.id]).filter(v=>v!==undefined&&v!==null&&v!=="");
  const n=vals.length;let cuerpo="";
  if(p.tipo==="abierta"){
    cuerpo=n?`<div class="textos">${vals.map(v=>`<p>${esc(v)}</p>`).join("")}</div>`:"";
  }else if(p.tipo==="escala"){
    const c=p.config||{};const min=+(c.min??1),max=+(c.max??10);const cnt={};vals.forEach(v=>cnt[v]=(cnt[v]||0)+1);
    const prom=n?vals.reduce((a,b)=>a+(+b),0)/n:0;
    if(c.nps&&n){const pro=vals.filter(v=>v>=9).length,det=vals.filter(v=>v<=6).length,pas=n-pro-det;const nps=Math.round((pro-det)/n*100);
      cuerpo+=`<div class="nps-box"><div><b>${nps}</b>NPS</div><div><b>${pro}</b>Promotores (9–10)</div><div><b>${pas}</b>Pasivos (7–8)</div><div><b>${det}</b>Detractores (${min}–6)</div></div>`}
    if(n) cuerpo+=`<p class="meta">Promedio: <b>${prom.toFixed(1)}</b></p>`;
    for(let k=max;k>=min;k--) cuerpo+=barra(String(k),cnt[k]||0,n);
  }else{
    const ops=Array.isArray(p.opciones)?p.opciones:[];const cnt={};
    vals.forEach(v=>(Array.isArray(v)?v:[v]).forEach(x=>cnt[x]=(cnt[x]||0)+1));
    const extra=Object.keys(cnt).filter(k=>!ops.includes(k));
    if(p.tipo==="likert"&&n){const fav=(cnt["Totalmente de acuerdo"]||0)+(cnt["De acuerdo"]||0);cuerpo+=`<div class="nps-box"><div><b>${Math.round(fav/n*100)}%</b>Favorable (de acuerdo + totalmente)</div></div>`}
    [...ops,...extra].forEach(o=>cuerpo+=barra(o,cnt[o]||0,n));
  }
  return `<div class="tarjeta res"><h3>${i+1}. ${esc(p.titulo)}</h3><p class="meta">${n} respuesta${n===1?"":"s"}${p.seccion?" · "+esc(p.seccion):""}</p>${n?cuerpo:'<p class="nota">Sin respuestas todavía.</p>'}</div>`;
}
function descargarExcel(){
  const R=respuestasFiltradas();
  const filas=R.slice().reverse().map((r,k)=>{
    const f={"N.º":k+1,"Fecha":new Date(r.enviada_en).toLocaleString("es-CR"),"Área":r.unidad||""};
    S.P.forEach((p,i)=>{const v=r.datos[p.id];f[`P${i+1}. ${p.titulo}`.slice(0,250)]=Array.isArray(v)?v.join("; "):(v??"")});
    return f;
  });
  const preg=S.P.map((p,i)=>({"N.º":i+1,"Sección":p.seccion||"","Pregunta":p.titulo,"Tipo":(TIPOS[p.tipo]||[p.tipo])[0],"Opciones":(p.opciones||[]).join(" | "),"Escala":p.tipo==="escala"?`${p.config.min??1}-${p.config.max??10}${p.config.nps?" (NPS)":""}`:"","Obligatoria":p.obligatoria?"Sí":"No","ID":p.id}));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(filas.length?filas:[{"Sin respuestas":""}]),"Respuestas");
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(preg),"Preguntas");
  XLSX.writeFile(wb,`${S.E.titulo}${S.filtro?" - "+S.filtro:""}.xlsx`.replace(/[\\/:*?"<>|]/g,"-"));
}

/* ===================== COMPARTIR ===================== */
function compartir(){
  const f=document.createElement("div");f.className="modal-fondo";f.id="m-compartir";
  document.body.appendChild(f);pintarCompartir();
  f.onclick=e=>{if(e.target===f)f.remove()};
}
function pintarCompartir(){
  const f=$("#m-compartir");if(!f)return;const base=baseURL();
  f.innerHTML=`<div class="modal" role="dialog" aria-label="Compartir"><div class="modal-cab"><h2>Compartir</h2><button class="ico" data-cerrar aria-label="Cerrar">${ICO.x}</button></div>
    ${S.E.estado!=="abierta"?`<p class="confirmar" style="color:var(--petroleo);background:var(--verde-suave)">La encuesta está en ${S.E.estado}. Los enlaces funcionarán cuando cambies el estado a Abierta.</p>`:""}
    <div><div class="eyebrow">Enlace general</div><p class="nota">Al entrar, la persona elige su área.</p>
    <div class="link-gen"><input class="txt" readonly value="${base}"><button class="btn" data-copiar="${base}">${ICO.copiar} Copiar enlace</button></div></div>
    <div><div class="eyebrow">Enlace y QR de cada área</div><p class="nota">Registran el área sola. Para cambiar nombres o agregar áreas usa la pestaña <b>Mensajes y áreas</b>.</p></div>
    <div class="areas">${S.U.map(u=>`<div class="area" data-u="${u.id}"><div class="qr" id="qr-${u.id}"></div><b>${esc(u.nombre)}</b>
      <div class="acc"><button class="btn sm" data-copiar="${base}?u=${u.slug}">${ICO.copiar} Copiar enlace</button><button class="btn sm" data-png>Descargar QR</button></div></div>`).join("")||'<p class="nota">No hay áreas todavía.</p>'}</div></div>`;
  f.querySelector("[data-cerrar]").onclick=()=>f.remove();
  f.querySelectorAll("[data-copiar]").forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copiar);toast("Enlace copiado.")}catch{toast("Selecciona el enlace y cópialo manualmente.")}});
  S.U.forEach(u=>{const el=$("#qr-"+u.id);if(el&&window.QRCode)new QRCode(el,{text:`${base}?u=${u.slug}`,width:300,height:300,colorDark:"#003C40",colorLight:"#FFFFFF",correctLevel:QRCode.CorrectLevel.M})});
  f.querySelectorAll(".area[data-u]").forEach(card=>{const u=S.U.find(x=>x.id===card.dataset.u);card.querySelector("[data-png]").onclick=()=>descargarQR(card,u)});
}
function descargarQR(card,u){
  const src=card.querySelector(".qr canvas")||card.querySelector(".qr img");if(!src)return;
  const W=600,H=720;const c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  x.fillStyle="#FFFFFF";x.fillRect(0,0,W,H);
  x.fillStyle="#B2D234";x.fillRect(W*0.62,H-14,W*0.38,14);
  const dibujar=img=>{x.drawImage(img,75,60,450,450);x.fillStyle="#003C40";x.textAlign="center";x.font="500 34px Jost, sans-serif";x.fillText(u.nombre,W/2,575);x.fillStyle="#58585B";x.font="24px Jost, sans-serif";x.fillText(S.E.titulo,W/2,620);
    const a=document.createElement("a");a.download=`QR ${u.nombre}.png`;a.href=c.toDataURL("image/png");a.click()};
  if(src.tagName==="CANVAS")dibujar(src);else{const im=new Image();im.onload=()=>dibujar(im);im.src=src.src}
}

iniciar();
</script>
